<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Pengelola - UMKM Bunaken</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800 text-base" onload="cekSesi()">
    
    <nav class="bg-blue-700 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="font-bold text-lg tracking-wide">Dashboard UMKM</h1>
        <div class="flex gap-2">
            <a href="index.html" target="_blank" class="bg-white text-blue-700 hover:bg-blue-50 px-3 py-2 rounded text-sm font-bold transition-colors shadow flex items-center gap-1">
                🌐 Lihat Beranda
            </a>
            <button onclick="logout()" class="bg-red-500 hover:bg-red-600 px-4 py-2 rounded text-sm font-semibold transition-colors shadow">
                Keluar (Logout)
            </button>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto mt-8 p-6 bg-white rounded-xl shadow-lg border border-gray-100 mb-10 space-y-8">
        
        <div>
            <h2 class="text-2xl font-bold mb-6 text-blue-800 border-b pb-2">Profil Lengkap Usaha Anda</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- KOLOM KIRI (Info Dasar) -->
                <div class="space-y-4">
                    <div>
                        <label class="block text-base font-semibold text-gray-700 mb-1">Nama Usaha <span class="text-red-500">*</span></label>
                        <input type="text" id="nama_usaha" class="w-full border border-gray-300 rounded p-3 text-base focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Contoh: Homestay Lestari">
                    </div>
                    <div>
                        <label class="block text-base font-semibold text-gray-700 mb-1">Kategori Usaha <span class="text-red-500">*</span></label>
                        <div>
   
    <select id="kategori" class="w-full border border-gray-300 rounded-lg px-4 py-2 bg-gray-50 text-base focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition">
        <option value="Homestay">Homestay / Penginapan</option>
        <option value="Alat Selam">Penyewaan Alat Selam / Snorkeling</option>
        <option value="Kuliner">Rumah Makan / Kuliner</option>
        <option value="Warung Kelontong">Warung / Kios Kelontong</option>
        <option value="Transportasi">Perahu / Penyeberangan</option>
        <option value="Suvenir">Suvenir / Kerajinan</option>
    </select>
</div>
                    </div>
                    <div>
                        <label class="block text-base font-semibold text-gray-700 mb-1">Deskripsi Fasilitas</label>
                        <textarea id="deskripsi" rows="3" class="w-full border border-gray-300 rounded p-3 text-base focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Ceritakan apa saja yang Anda tawarkan..."></textarea>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-base font-semibold text-gray-700 mb-1">Nomor Telp / Whatsapp (WA) <span class="text-red-500">*</span></label>
                            <input type="text" id="nomor_wa" class="w-full border border-gray-300 rounded p-3 text-base focus:ring-2 focus:ring-blue-500 outline-none" placeholder="0812345...">
                        </div>
                        
<div>
    <label class="block text-sm font-medium text-gray-700 mb-1">Hari & Jam Operasional</label>
    <div class="flex flex-col gap-2">
        <!-- Tambahan Opsi Hari Buka -->
        <select id="hari_buka" class="w-full border border-gray-300 rounded-lg px-3 py-2 bg-gray-50 text-sm focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition">
            <option value="Setiap Hari">Setiap Hari</option>
            <option value="Senin - Sabtu">Senin - Sabtu</option>
            <option value="Senin - Jumat">Senin - Jumat</option>
            <option value="Sabtu - Minggu (Akhir Pekan)">Sabtu - Minggu (Akhir Pekan)</option>
        </select>
        
        <!-- Opsi Jam Buka & Tutup -->
        <div class="flex items-center gap-2">
            <input type="time" id="jam_buka" class="w-full border border-gray-300 rounded-lg px-2 py-2 bg-gray-50 text-sm focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition disabled:opacity-50 disabled:cursor-not-allowed">
            <span class="text-gray-500 font-bold">-</span>
            <input type="time" id="jam_tutup" class="w-full border border-gray-300 rounded-lg px-2 py-2 bg-gray-50 text-sm focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition disabled:opacity-50 disabled:cursor-not-allowed">
        </div>
        
        <!-- Opsi 24 Jam -->
        <div class="flex items-center gap-2 mt-1">
            <input type="checkbox" id="jam_24" class="w-4 h-4 text-blue-600 rounded border-gray-300 focus:ring-blue-500 cursor-pointer" onchange="toggleJam24()">
            <label for="jam_24" class="text-sm text-gray-700 font-medium cursor-pointer">Buka 24 Jam Penuh</label>
        </div>
    </div>
</div>
                        
                    </div>
                    <div>
                        <label class="block text-base font-semibold text-gray-700 mb-1">Link Google Maps</label>
                        <input type="text" id="link_maps" class="w-full border border-gray-300 rounded p-3 text-base focus:ring-2 focus:ring-blue-500 outline-none" placeholder="https://maps.app.goo.gl/...">
                    </div>
                    <div>
                        <label class="block text-base font-semibold text-gray-700 mb-1">Link Website / Sosial Media</label>
                        <input type="text" id="link_medsos" class="w-full border border-gray-300 rounded p-3 text-base focus:ring-2 focus:ring-blue-500 outline-none" placeholder="https://instagram.com/... atau https://situs.com">
                    </div>
                </div>

                <!-- KOLOM KANAN (Foto & Produk) -->
                <div class="space-y-4 bg-gray-50 p-4 rounded-lg border border-gray-200">
                    <div>
                        <label class="block text-base font-semibold text-gray-700 mb-1">Foto Utama (Toko/Homestay)</label>
                        <input type="file" id="foto_profil" accept="image/*" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                        
                        <div id="preview_foto_utama" class="mt-3 hidden relative w-40 h-24">
                            <img id="img_preview_utama" src="" class="w-full h-full object-cover rounded-lg shadow border border-gray-300">
                            <button onclick="hapusFotoUtama()" class="absolute -top-2 -right-2 bg-red-500 hover:bg-red-600 text-white font-bold rounded-full w-7 h-7 flex items-center justify-center shadow-lg transform hover:scale-110 transition">X</button>
                        </div>
                    </div>

                    <!-- Galeri Produk / Layanan (Maks. 5 Foto) -->
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label class="block text-base font-semibold text-gray-700">Galeri Produk / Layanan (Maks. 5 Foto)</label>
                            <button type="button" onclick="tambahBarisGaleri()" class="bg-green-500 text-white text-xs px-2.5 py-1 rounded hover:bg-green-600 font-bold">+ Tambah Foto</button>
                        </div>
                        <p class="text-xs text-gray-500 mb-2">Unggah foto fasilitas atau produk satu per satu sesuai kebutuhan.</p>
                        
                        <div id="wadah_input_galeri" class="space-y-2">
                            <!-- Baris input galeri satuan muncul via JS -->
                        </div>
                    </div>

                    <div>
                        <label class="block text-base font-semibold text-gray-700 mb-1">Info Promosi (Opsional)</label>
                        <input type="text" id="promosi" class="w-full border border-gray-300 rounded p-3 text-base focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Contoh: Diskon 10% sewa alat bulan ini!">
                    </div>

                    <div class="mt-4">
                        <div class="flex justify-between items-center mb-2">
                            <label class="block text-base font-semibold text-gray-700">Daftar Produk & Layanan</label>
                            <button onclick="tambahBarisProduk()" class="bg-green-500 text-white text-xs px-2 py-1 rounded hover:bg-green-600 font-bold">+ Tambah</button>
                        </div>
                        <div id="wadah_produk" class="space-y-2"></div>
                    </div>
                </div>
            </div>

            <p id="pesan-dashboard" class="text-base font-medium text-center hidden p-3 rounded-lg mt-6"></p>

            <button onclick="simpanProfil()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg mt-4 shadow-lg transition-all text-lg">
                💾 Simpan Data & Foto Usaha
            </button>
            
            <hr class="my-8 border-gray-200">
            
            <!-- Area QR Code -->
            <div class="bg-blue-50 p-6 rounded-lg text-center border border-blue-100">
                <h3 class="text-xl font-bold text-gray-800 mb-2">💳 QR Code Digital Promosi</h3>
                <button id="btn-qr" onclick="generateQR()" class="w-full sm:w-auto bg-gray-400 text-white font-bold py-3 px-6 rounded shadow cursor-not-allowed transition-all text-base" disabled>
                    Generate QR Code Saya
                </button>
                
                <div id="qr-result" class="mt-6 hidden flex-col items-center justify-center space-y-3">
                    <div id="area-cetak-qr" class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 inline-block text-center">
                        <h4 id="qr-nama-usaha" class="font-bold text-lg text-gray-900 mb-2"></h4>
                        <img id="qr-image" src="" alt="QR Code UMKM" class="border-2 border-gray-100 shadow-sm rounded-lg mx-auto">
                        <p class="text-xs text-gray-500 mt-2">Scan untuk info & pemesanan</p>
                    </div>

                    <div class="flex flex-wrap gap-2 justify-center items-center mt-2">
                        <a id="link-halaman-usaha" href="#" target="_blank" class="text-blue-600 hover:underline font-semibold text-sm bg-white px-4 py-2 rounded-lg border border-blue-200 shadow-sm">
                            🔗 Buka Halaman Web Usaha Saya
                        </a>
                        <button onclick="unduhQR()" class="bg-green-600 hover:bg-green-700 text-white text-sm font-bold py-2 px-4 rounded-lg shadow-md flex items-center gap-1">
                            📥 Unduh Gambar QR
                        </button>
                        <button onclick="cetakQR()" class="bg-gray-800 hover:bg-gray-900 text-white text-sm font-bold py-2 px-4 rounded-lg shadow-md flex items-center gap-1">
                            🖨️ Cetak Stiker QR
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- FITUR OPSIONAL: GANTI PASSWORD -->
        <div class="bg-gray-50 p-6 rounded-xl border border-gray-200 max-w-lg">
            <button onclick="toggleFormPassword()" class="w-full text-left flex justify-between items-center font-bold text-blue-800 text-base outline-none">
                <span>🔐 Ingin Mengubah Kata Sandi Akun?</span>
                <span id="ikon-panah" class="text-lg">▼</span>
            </button>
            
            <div id="form-ganti-pass-container" class="hidden mt-4 pt-4 border-t border-gray-200 space-y-3">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Password Baru</label>
                    <input type="password" id="input_password_baru" placeholder="Minimal 6 karakter" class="w-full border border-gray-300 rounded p-3 text-base outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Ulangi Password Baru</label>
                    <input type="password" id="input_password_konfirmasi" placeholder="Ketik ulang password baru" class="w-full border border-gray-300 rounded p-3 text-base outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                </div>
                <p id="pesan-ganti-pass" class="text-sm font-medium"></p>
                <button onclick="ubahPasswordBaru()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded text-sm transition-all shadow">
                    Simpan Password Baru
                </button>
            </div>
        </div>

    </main>
    
    <script src="app.js"></script>
</body>
</html>
