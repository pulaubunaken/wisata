<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Daftar - UMKM Bunaken</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-blue-200 min-h-screen flex items-center justify-center p-4">
    
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
        <!-- Header Judul -->
        <div class="text-center mb-8">
            <h2 id="form-title" class="text-3xl font-extrabold text-blue-700">Masuk Akun</h2>
            <p id="form-subtitle" class="text-gray-500 mt-2">Kelola promosi usaha Anda di Bunaken</p>
        </div>

        <!-- Form Input -->
        <div class="space-y-5">
            <div>
                <label class="block text-gray-700 text-sm font-semibold mb-2">Alamat Email</label>
                <input type="email" id="email" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all outline-none" placeholder="contoh@email.com">
            </div>

            <div>
                <label class="block text-gray-700 text-sm font-semibold mb-2">Kata Sandi</label>
                <input type="password" id="password" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all outline-none" placeholder="Minimal 6 karakter">
            </div>

            <!-- Tombol Lupa Password (Hanya muncul saat mode Login) -->
            <div id="wrapper-lupa-sandi" class="text-right -mt-2">
                <button onclick="lupaPassword()" class="text-xs text-blue-600 hover:underline font-semibold">Lupa Kata Sandi?</button>
            </div>

            <!-- Pesan Notifikasi (Awalnya disembunyikan) -->
            <div id="pesan-notif" class="text-sm font-medium text-center hidden p-3 rounded-lg transition-all"></div>

            <!-- Tombol Utama (Bisa berubah jadi Masuk / Daftar) -->
            <button id="btn-utama" onclick="isLoginMode ? login() : register()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition-all shadow-lg shadow-blue-500/30">
                Masuk
            </button>
        </div>

        <!-- Teks Beralih Mode (Toggle) -->
        <div class="mt-6 text-center">
            <p class="text-gray-600 text-sm">
                <span id="teks-toggle">Belum punya akun?</span> 
                <button onclick="toggleMode()" class="text-blue-600 font-bold hover:underline ml-1 outline-none">
                    <span id="link-toggle">Daftar sekarang</span>
                </button>
            </p>
        </div>

        <!-- Tombol Kembali -->
        <div class="mt-8 text-center border-t border-gray-100 pt-6">
            <a href="index.html" class="text-sm text-gray-400 hover:text-blue-600 transition-colors">← Kembali ke Beranda</a>
        </div>
    </div>

    <!-- Memanggil Script Utama -->
    <script src="app.js"></script>
    
    <!-- Script untuk animasi ganti tampilan form & menyembunyikan tombol lupa sandi saat daftar -->
    <script>
        let isLoginMode = true;

        function toggleMode() {
            isLoginMode = !isLoginMode;
            
            const title = document.getElementById('form-title');
            const subtitle = document.getElementById('form-subtitle');
            const btnUtama = document.getElementById('btn-utama');
            const teksToggle = document.getElementById('teks-toggle');
            const linkToggle = document.getElementById('link-toggle');
            const notif = document.getElementById('pesan-notif');
            const wrapperLupaSandi = document.getElementById('wrapper-lupa-sandi');
            
            // Bersihkan form setiap kali pindah mode
            document.getElementById('email').value = '';
            document.getElementById('password').value = '';
            notif.className = "hidden";

            if (isLoginMode) {
                // Tampilan Mode Masuk (Login)
                title.innerText = "Masuk Akun";
                subtitle.innerText = "Kelola promosi usaha Anda di Bunaken";
                btnUtama.innerText = "Masuk";
                btnUtama.className = "w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition-all shadow-lg shadow-blue-500/30";
                teksToggle.innerText = "Belum punya akun?";
                linkToggle.innerText = "Daftar sekarang";
                wrapperLupaSandi.classList.remove('hidden'); // Munculkan lagi tombol lupa sandi
            } else {
                // Tampilan Mode Daftar (Register)
                title.innerText = "Buat Akun Baru";
                subtitle.innerText = "Daftarkan UMKM Anda sekarang juga";
                btnUtama.innerText = "Daftar Akun";
                btnUtama.className = "w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg transition-all shadow-lg shadow-green-500/30";
                teksToggle.innerText = "Sudah punya akun?";
                linkToggle.innerText = "Masuk di sini";
                wrapperLupaSandi.classList.add('hidden'); // Sembunyikan tombol lupa sandi saat mendaftar
            }
        }
    </script>
</body>
</html>
