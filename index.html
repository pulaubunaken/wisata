<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Wisata Bunaken</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans text-base" onload="loadBeranda()">

    <!-- Navbar / Header -->
    <nav class="bg-blue-700 text-white p-4 shadow-lg sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="font-extrabold text-xl tracking-wider flex items-center gap-2">
                🌊 INFO BUNAKEN
            </h1>
            <a href="login.html" class="bg-white text-blue-700 text-sm md:text-base font-bold px-4 py-2 rounded-full shadow hover:bg-blue-50 transition">
                Login UMKM
            </a>
        </div>
    </nav>

    <!-- Hero Banner -->
    <div class="bg-blue-600 text-white text-center py-10 px-4 relative overflow-hidden">
        <div class="relative z-10 max-w-2xl mx-auto">
            <h2 class="text-3xl md:text-4xl font-extrabold mb-3 drop-shadow-md">Eksplorasi Keindahan Bunaken</h2>
            <p class="text-blue-100 text-base md:text-lg">Temukan penginapan, kuliner lezat, dan alat selam dari warga lokal.</p>
        </div>
        <div class="absolute inset-0 opacity-10 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-white via-transparent to-transparent"></div>
    </div>

    <!-- Bagian Katalog UMKM -->
    <main class="max-w-6xl mx-auto p-6 mt-4 relative z-20">
        
        <!-- Header & Mesin Pencari / Filter -->
        <div class="mb-8">
            <h3 class="text-2xl font-bold text-gray-800 mb-4 border-b-2 border-blue-500 pb-2 inline-block">Direktori UMKM Lokal</h3>
            
            <div class="flex flex-col md:flex-row gap-4 mt-2">
                <!-- Kotak Pencarian -->
                <input type="text" id="input-cari" oninput="filterKatalog()" placeholder="🔍 Cari nama atau fasilitas..." class="w-full md:w-1/2 px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none shadow-sm text-base">
                
                <!-- Kotak Filter -->
                <select id="filter-kategori" onchange="filterKatalog()" class="w-full md:w-1/3 px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-white shadow-sm text-base">
                    <option value="Semua">Tampilkan Semua Kategori</option>
                    <option value="Homestay">Homestay / Penginapan</option>
                    <option value="Alat Selam">Penyewaan Alat Selam</option>
                    <option value="Kuliner">Rumah Makan / Kuliner</option>
                    <option value="Transportasi">Perahu / Penyeberangan</option>
                    <option value="Suvenir">Suvenir / Kerajinan</option>
                </select>
            </div>
        </div>

        <!-- Pesan Loading -->
        <div id="loading-beranda" class="text-center py-10">
            <p class="text-gray-500 font-semibold animate-pulse text-lg">Memuat katalog wisata...</p>
        </div>

        <!-- Wadah Grid Card UMKM -->
        <div id="katalog-umkm" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 hidden">
            <!-- Kartu UMKM akan muncul otomatis dari database di sini -->
        </div>

        <!-- Kontrol Paging (Pagination Beranda) -->
        <div id="paging-beranda-container" class="flex justify-between items-center mt-10 pt-4 border-t border-gray-200 hidden">
            <button id="btn-beranda-prev" onclick="gantiHalamanBeranda(-1)" class="bg-white border border-gray-300 hover:bg-gray-100 text-gray-700 px-5 py-2.5 rounded-lg text-base font-semibold disabled:opacity-40 disabled:cursor-not-allowed shadow-sm">
                ← Sebelumnya
            </button>
            <span id="info-halaman-beranda" class="text-base text-gray-700 font-bold">Halaman 1 dari 1</span>
            <button id="btn-beranda-next" onclick="gantiHalamanBeranda(1)" class="bg-white border border-gray-300 hover:bg-gray-100 text-gray-700 px-5 py-2.5 rounded-lg text-base font-semibold disabled:opacity-40 disabled:cursor-not-allowed shadow-sm">
                Selanjutnya →
            </button>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white text-center py-6 mt-12">
        <p class="text-sm text-gray-400">© 2026 Digitalisasi Promosi Wisata Pulau Bunaken.</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
