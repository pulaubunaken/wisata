    <script>
        function geserGaleri(arah) {
            const galeri = document.getElementById('d-galeri');
            const scrollAmount = galeri.clientWidth / 3; 
            galeri.scrollBy({ left: arah * scrollAmount, behavior: 'smooth' });
        }

        document.addEventListener("DOMContentLoaded", () => {
            const slider = document.getElementById('d-galeri');
            let isDown = false;
            let startX;
            let scrollLeft;

            slider.addEventListener('mousedown', (e) => {
                isDown = true;
                slider.classList.add('cursor-grabbing');
                startX = e.pageX - slider.offsetLeft;
                scrollLeft = slider.scrollLeft;
            });
            slider.addEventListener('mouseleave', () => {
                isDown = false;
                slider.classList.remove('cursor-grabbing');
            });
            slider.addEventListener('mouseup', () => {
                isDown = false;
                slider.classList.remove('cursor-grabbing');
            });
            slider.addEventListener('mousemove', (e) => {
                if (!isDown) return;
                e.preventDefault();
                const x = e.pageX - slider.offsetLeft;
                const walk = (x - startX) * 2; 
                slider.scrollLeft = scrollLeft - walk;
            });
        });
    </script>

    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({pageLanguage: 'id', autoDisplay: false}, 'google_translate_element');
        }
        function gantiBahasa(langCode) {
            if (langCode === 'id') {
                document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
                document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; domain=" + window.location.hostname + "; path=/;";
            } else {
                document.cookie = "googtrans=/id/" + langCode + "; path=/";
                document.cookie = "googtrans=/id/" + langCode + "; domain=" + window.location.hostname + "; path=/";
            }
            window.location.reload(); 
        }
        window.addEventListener('load', () => {
            let match = document.cookie.match(/googtrans=\/id\/([a-zA-Z-]+)/);
            let lang = match ? match[1] : 'id';
            let customSelect = document.getElementById("pilihan-bahasa");
            if (customSelect) customSelect.value = lang;
        });
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
